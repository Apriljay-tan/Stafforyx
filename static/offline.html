<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stafforyx HR - Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 24px;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #111c33;
      border: 1px solid #273550;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.4rem;
      color: #ffffff;
    }
    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Stafforyx HR needs an internet connection.</h1>
    <p>Please reconnect and try again.</p>
  </div>
</body>
</html>
