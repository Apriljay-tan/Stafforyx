{% extends 'base.html' %}

{% block title %}New Message{% endblock %}
{% block page_title %}New Message{% endblock %}

{% block content %}
<div class="mb-3">
  <a href="{% url 'messaging:inbox' %}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i>Back to Inbox
  </a>
</div>

<div class="card">
  <div class="card-header">
    <i class="bi bi-pencil-square me-1" style="color:#1565C0;"></i>Start a Conversation
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Conversation type</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="compose_type" id="type_admin_support"
                 value="admin_support" checked>
          <label class="form-check-label" for="type_admin_support">Message employee (admin support)</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="compose_type" id="type_group" value="group">
          <label class="form-check-label" for="type_group">Create official group</label>
        </div>
      </div>

      <div id="adminSupportFields">
        <div class="mb-3">
          <label class="form-label fw-semibold" for="employee_id">Employee</label>
          <select name="employee_id" id="employee_id" class="form-select">
            <option value="">Select employee…</option>
            {% for employee in employees %}
              <option value="{{ employee.pk }}">
                {{ employee }} — {{ employee.company.name }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div id="groupFields" style="display:none;">
        <div class="mb-3">
          <label class="form-label fw-semibold" for="company_id">Company</label>
          <select name="company_id" id="company_id" class="form-select">
            {% for company in companies %}
              <option value="{{ company.pk }}">{{ company.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="title">Group title</label>
          <input type="text" name="title" id="title" class="form-control" maxlength="150">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Participants (chat-enabled employees)</label>
          <select name="participant_ids" class="form-select" multiple size="8">
            {% for employee in group_employees %}
              <option value="{{ employee.user_id }}">
                {{ employee }} — {{ employee.company.name }}
              </option>
            {% endfor %}
          </select>
          <div class="form-text">Select at least two participants for a group conversation.</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">
        <i class="bi bi-chat-dots me-1"></i>Start Conversation
      </button>
    </form>
  </div>
</div>

<script>
  (function () {
    var adminRadio = document.getElementById('type_admin_support');
    var groupRadio = document.getElementById('type_group');
    var adminFields = document.getElementById('adminSupportFields');
    var groupFields = document.getElementById('groupFields');
    function sync() {
      var isGroup = groupRadio.checked;
      adminFields.style.display = isGroup ? 'none' : '';
      groupFields.style.display = isGroup ? '' : 'none';
    }
    adminRadio.addEventListener('change', sync);
    groupRadio.addEventListener('change', sync);
    sync();
  })();
</script>
{% endblock %}
