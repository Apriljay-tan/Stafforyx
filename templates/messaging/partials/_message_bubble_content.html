{% if message.body %}
  <div class="msg-chat-bubble-text">{{ message.body }}</div>
{% endif %}
{% if message.attachments %}
  <div class="msg-chat-attachments{% if message.body %} msg-chat-attachments--with-text{% endif %}">
    {% for attachment in message.attachments %}
      {% if attachment.attachment_type == 'voice' %}
        <audio controls preload="metadata" class="msg-chat-voice-player" src="{{ attachment.url }}">
          Your browser does not support audio playback.
        </audio>
      {% else %}
        <a href="{{ attachment.url }}" target="_blank" rel="noopener noreferrer" class="msg-chat-attachment-link">
          <img src="{{ attachment.url }}"
               alt="{{ attachment.original_filename }}"
               class="msg-chat-attachment-img{% if attachment.attachment_type == 'gif' %} msg-chat-attachment-img--gif{% endif %}"
               loading="lazy">
        </a>
      {% endif %}
    {% endfor %}
  </div>
{% endif %}
