{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Stafforyx" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'images/pwa/icon-192.png' %}" />
  <link rel="apple-touch-icon" href="{% static 'images/pwa/apple-touch-icon.png' %}" />
  <title>{% block title %}Authentication{% endblock %} | Stafforyx HR</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: #f4f6fa;
      color: #1a1a2e;
    }
    .auth-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .auth-wrap {
      width: 100%;
      max-width: 700px;
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 1rem;
      color: #0d1b2a;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .card {
      border: 1px solid #e8edf5;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
    }
    .card-header {
      background: #fff;
      border-bottom: 1px solid #f0f4f8;
      font-weight: 600;
      color: #0d1b2a;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <main class="auth-shell">
    <div class="auth-wrap">
      <div class="auth-brand">Stafforyx HR</div>

      {% if messages %}
        <div class="mb-3">
          {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show mb-2" role="alert">
              <i class="bi bi-{% if message.tags == 'success' %}check-circle-fill{% elif message.tags == 'error' or message.tags == 'danger' %}x-circle-fill{% elif message.tags == 'warning' %}exclamation-triangle-fill{% else %}info-circle-fill{% endif %} me-2"></i>
              {{ message }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
          {% endfor %}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).catch(function (error) {
          console.warn('Service worker registration failed:', error);
        });
      });
    }
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
