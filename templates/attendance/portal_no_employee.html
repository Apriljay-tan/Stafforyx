{% extends 'base.html' %}
{% block title %}Attendance Portal{% endblock %}
{% block page_title %}Attendance Portal{% endblock %}

{% block extra_css %}
<style>
  /* iOS status-bar (safe-area) fix — phone-facing attendance portal page. */
  @media (max-width: 768px) {
    #topbar {
      /* 16px fallback (Android / browser / non-notch) PLUS the device inset. */
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      min-height: calc(76px + env(safe-area-inset-top, 0px));
      height: auto;
      align-items: center;
    }
    #main-content {
      padding-top: calc(76px + env(safe-area-inset-top, 0px));
    }
  }
</style>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body text-center py-5">
        <i class="bi bi-person-x" style="font-size:2.5rem;color:#dc3545;"></i>
        <h5 class="mt-3 mb-2">Employee Profile Not Linked</h5>
        <p class="text-muted" style="font-size:.9rem;">{{ message }}</p>
        <a href="/" class="btn btn-outline-secondary btn-sm mt-2">
          <i class="bi bi-house me-1"></i>Go to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
